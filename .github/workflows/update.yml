name: Auto Update SonyLIV Playlist

on:
  schedule:
    # Har 5 minute me chalega
    - cron: '*/5 * * * *'
  workflow_dispatch: # Taaki aap manually bhi 'Run Workflow' button daba sako

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Update Script
        run: python update.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto Update SonyLIV Token [skip ci]" && git push)
